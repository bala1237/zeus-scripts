<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>City</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #cfe2f2; font-family: system-ui, sans-serif; }
  #label { position: fixed; left: 16px; top: 12px; color: #1d1a2e; font: 700 15px system-ui; background: rgba(255,255,255,.7); padding: 6px 12px; border-radius: 8px; }
</style>
</head>
<body>
<div id="label"></div>
<div id="load" style="position:fixed;left:50%;top:50%;width:min(60vw,420px);height:10px;margin:-5px 0 0 calc(min(60vw,420px) / -2);background:rgba(255,255,255,.6);border-radius:6px;overflow:visible"><div style="border-radius:6px;height:100%;width:2%;background:#2f6fb0;transition:width .2s"></div><div style="position:absolute;top:18px;left:0;right:0;text-align:center;font:600 14px system-ui;color:#1d1a2e">Building the city…</div></div>
<div id="panel" style="position:fixed;left:16px;bottom:14px;font:600 13px system-ui;color:#1d1a2e;max-width:calc(100vw - 32px)">
  <button id="fold" title="Hide or show controls">☰ Controls</button>
  <div id="body">
    <div id="nav" class="row"></div>
    <div class="row">
      <button id="tour">🎥 Tour: on</button>
      <button id="battle" title="Start a demo battle at the south gate">⚔ Battle</button>
      <a href="./stage.html" target="_blank" title="The music stage: lasers and backgrounds on the beat, in its own window">♪ Stage</a>
      <button id="spin">⟳ Rotate: on</button>
      <button data-z="-1" title="Zoom in">＋</button><button data-z="1" title="Zoom out">－</button>
      <button data-p="-1,0" title="Pan left">←</button><button data-p="0,1" title="Pan forward">↑</button><button data-p="0,-1" title="Pan back">↓</button><button data-p="1,0" title="Pan right">→</button>
      <button id="reset">Reset</button>
    </div>
  </div>
</div>
<style>
  #panel .row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  #panel button, #panel a { background: rgba(255,255,255,.85); color: #1d1a2e; padding: 7px 11px; border-radius: 8px; text-decoration: none; border: 0; font: inherit; cursor: pointer; min-width: 34px; }
  #panel a.on { background: #2f6fb0; color: #fff; }
  #panel.shut #body { display: none; }
  /* ?ui=0: nothing over the picture, for a browser source in OBS (ZW-048) */
  body.plain #panel, body.plain #label { display: none; }
</style>
<script>
  // view links; the rest of the panel is wired up in city.js
  const q = new URLSearchParams(location.search), nav = document.getElementById('nav'), panel = document.getElementById('panel');
  const link = (t, k, v, d) => { const u = new URLSearchParams(q); u.set(k, v); const a = document.createElement('a'); a.textContent = t; a.href = '?' + u; if ((q.get(k) || d) === v) a.className = 'on'; nav.append(a); };
  if (q.get('ui') === '0' || (window.obsstudio && q.get('ui') !== '1')) document.body.classList.add('plain');   // inside OBS the controls are never shown (ZW-056)
  if (q.has('shot')) panel.remove(); else { for (const v of ['wide', 'plaza', 'street', 'temple', 'harbour', 'river', 'homes', 'civic', 'battle', 'top']) link(v, 'view', v, q.has('view') ? 'wide' : ''); link('☀ ↔ 🌙 cycle', 'light', 'cycle', 'cycle'); link('day', 'light', 'day', 'cycle'); link('dusk', 'light', 'dusk', 'cycle'); }
  document.getElementById('fold')?.addEventListener('click', () => { panel.classList.toggle('shut'); try { localStorage.setItem('zw-panel', panel.classList.contains('shut') ? '1' : ''); } catch {} });
  try { if (localStorage.getItem('zw-panel')) panel.classList.add('shut'); } catch {}
</script>
<script type="module" src="./city.js"></script>
</body>
</html>
