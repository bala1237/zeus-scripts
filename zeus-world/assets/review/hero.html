<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Zeus · Hero film</title>
<style>
  /* A hero film (ZW-047): a one-minute story film that honours the person who carried a battle. The footage and the sound are made
     in advance; the name is drawn here when it plays, so the same film serves anyone. The picture is always 16:9. */
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; font-family: 'Cinzel', Georgia, 'Times New Roman', serif; }
  body { display: flex; flex-direction: column; }
  #area { position: relative; flex: 1; min-height: 0; background: #000; }
  #frame { position: absolute; overflow: hidden; background: #000; container-type: size; }
  #frame > * { position: absolute; }
  video { inset: 0; width: 100%; height: 100%; object-fit: cover; }
  #shade { inset: 0; background: #000; opacity: 1; pointer-events: none; }
  /* the hook: one ember crossing the dark */
  #ember { left: 0; top: 0; width: 2.2cqh; height: 2.2cqh; border-radius: 50%; opacity: 0; background: radial-gradient(circle, #fff6d8 0 18%, #ffb347 40%, rgba(255, 110, 20, .5) 62%, transparent 75%); box-shadow: 0 0 3cqh 1cqh rgba(255, 140, 40, .55), 0 0 9cqh 3cqh rgba(255, 90, 10, .25); }
  /* The name as a film title: each letter is a piece of polished gold with a dark, deep edge. The page moves every letter by itself (see forged() in hero.js). */
  .name { white-space: nowrap; font-family: var(--title, 'Cinzel'), 'Cinzel', serif; font-weight: var(--tw, 800); isolation: isolate; }
  .name .l { display: inline-block; position: relative; opacity: 0; color: #2b1602; will-change: transform, filter, opacity;
    text-shadow: 0 .012em 0 #7a4709, 0 .024em 0 #5f340a, 0 .037em 0 #482606, 0 .05em 0 #2e1702, 0 .075em .05em rgba(0, 0, 0, .9), 0 0 .3em rgba(255, 150, 40, .5), 0 0 1em rgba(255, 110, 20, .32); }
  /* the gold face, with a hard horizon in the middle as polished metal has, and a streak of light that is slid across it */
  .name .l::after { content: attr(data-c); position: absolute; left: 0; top: 0; color: transparent; text-shadow: none;
    background: linear-gradient(105deg, transparent 38%, rgba(255, 255, 255, .95) 50%, transparent 62%) var(--gx, 140%) 0 / 400% 100% no-repeat,
      linear-gradient(180deg, #fffbe6 0%, #ffe9a6 22%, #f3bf48 45%, #a8690f 50.5%, #f8d67a 55%, #e0a436 76%, #8c500b 100%);
    -webkit-background-clip: text; background-clip: text; }
  .name .sp { display: inline-block; width: .38em; }
  /* the heroic moment: a streak of white light, the name forged out of it, and the honour beneath between two drawn lines */
  #forge { left: 0; right: 0; top: 30cqh; padding: 6cqh 0 5cqh; background: radial-gradient(ellipse 48% 50% at 50% 48%, rgba(0, 0, 0, .66), rgba(0, 0, 0, .3) 52%, transparent 92%); text-align: center; font-size: 11cqh; opacity: 0; }
  #forge .flare { position: absolute; left: 50%; top: 46%; width: 96cqw; height: .7cqh; margin: -.35cqh 0 0 -48cqw; opacity: 0; filter: blur(.2cqh); background: radial-gradient(ellipse at center, #fff 0%, rgba(255, 228, 160, .95) 14%, rgba(255, 150, 40, .5) 42%, transparent 70%); }
  #forge .flare::after { content: ''; position: absolute; left: 50%; top: 50%; width: 30cqh; height: 30cqh; margin: -15cqh; border-radius: 50%; background: radial-gradient(circle, rgba(255, 244, 210, .9) 0%, rgba(255, 170, 60, .35) 28%, transparent 62%); }
  .under { display: flex; align-items: center; justify-content: center; gap: 2.2cqh; margin-top: 1.6cqh; font: 600 3cqh 'Cinzel', serif; letter-spacing: .46em; color: #fff3d6; text-shadow: 0 .2cqh .3cqh #000, 0 0 1cqh #000, 0 0 2cqh #000; white-space: nowrap; }
  .under i { height: .22cqh; width: calc(var(--r, 0) * 15cqh); background: linear-gradient(90deg, transparent, #e9c275); }
  .under i:last-child { background: linear-gradient(270deg, transparent, #e9c275); }
  .under span { margin-right: -.46em; opacity: var(--r, 0); }
  #sparks { inset: 0; width: 100%; height: 100%; pointer-events: none; mix-blend-mode: screen; }
  /* the name, cut in stone, low in the picture */
  #stone { left: 0; right: 0; bottom: 9cqh; text-align: center; opacity: 0; }
  #stone .n { font-weight: 600; font-size: 5.2cqh; letter-spacing: .34em; margin-left: .34em; color: #f4e3bd; text-shadow: 0 .2cqh 0 rgba(0, 0, 0, .7), 0 0 2.4cqh rgba(255, 200, 110, .55); white-space: nowrap; }
  #stone .rule { width: 34cqh; height: .18cqh; margin: 1.2cqh auto; background: linear-gradient(90deg, transparent, #e9c275, transparent); }
  /* the end card */
  #card { inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; opacity: 0; background: radial-gradient(ellipse at 50% 45%, rgba(60, 34, 6, .55), #000 70%); }
  #crest { position: relative; flex: none; width: 26cqh; height: 26cqh; }
  #crest svg { width: 100%; height: 100%; }
  /* the hero's picture, in a ring of gold inside the laurel; without one, the laurel alone */
  #cardPic { display: none; position: absolute; left: 50%; top: 52%; width: 58%; height: 58%; transform: translate(-50%, -50%); border-radius: 50%; object-fit: cover; border: .45cqh solid #e9c275; box-shadow: 0 0 0 .15cqh #7a4709, 0 0 3cqh rgba(255, 170, 60, .55); }
  #card.pic #crest { width: 40cqh; height: 40cqh; margin-top: -2cqh; } #card.pic #cardPic { display: block; }
  #card.pic .n { margin-top: .5cqh; } #card.pic .t { margin-top: 2.5cqh; }
  #card .n { font-size: 8.4cqh; margin-top: 2cqh; }
  #card .t { font-weight: 400; font-size: 3cqh; letter-spacing: .42em; margin: 4cqh 0 6cqh .42em; color: #e9c98a; white-space: nowrap; }
  #caption { left: 0; right: 0; bottom: 3.2cqh; text-align: center; font: italic 500 3.1cqh 'Cormorant Garamond', Georgia, serif; letter-spacing: .02em; color: #fff; text-shadow: 0 0 1cqh #000, 0 0 .4cqh #000; opacity: 0; transition: opacity .3s; padding: 0 8cqh; }
  body.captions #caption.on { opacity: .95; }
  #ui { flex: none; box-sizing: border-box; width: 100%; color: #fff; font: 600 13px system-ui, sans-serif; background: #100c06; border-top: 1px solid rgba(233, 194, 117, .45); padding: 8px 14px 10px; display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; justify-content: center; }
  #ui.gone { display: none; }
  /* with the controls showing, a thin gold line marks the 16:9 picture, so that a window capture can be cropped to it exactly; never drawn when the controls are off */
  body:not(.bare) #frame { outline: 2px solid rgba(233, 194, 117, .75); }
  #ui button { background: #8a5a12; color: #fff; padding: 7px 12px; border-radius: 8px; border: 0; font: inherit; cursor: pointer; }
  #ui button.on { background: #e2b04a; color: #1d1305; }
  #ui input[type=text] { font: inherit; font-weight: 500; padding: 6px 8px; border-radius: 6px; border: 1px solid #6a4a1a; background: #1a1206; color: #fff; width: 190px; }
  #ui label { font-weight: 500; font-size: 12px; display: flex; align-items: center; gap: 6px; }
</style>
</head>
<body>
<div id="area"><div id="frame">
  <video id="film" playsinline preload="auto"></video>
  <div id="shade"></div>
  <div id="ember"></div>
  <div id="forge"><div class="flare"></div><div class="name" id="forgeName"></div><div class="under"><i></i><span id="forgeTitle"></span><i></i></div></div>
  <div id="stone"><div class="rule"></div><div class="n" id="stoneName"></div><div class="rule"></div></div>
  <div id="card">
    <div id="crest"><svg viewBox="0 0 200 200" fill="none" stroke="#e9c275" stroke-width="2.2" stroke-linecap="round" id="laurel"></svg><img id="cardPic" alt="" src="data:,"></div>
    <div class="n name" id="cardName"></div><div class="t" id="cardTitle"></div>
  </div>
  <canvas id="sparks"></canvas>
  <div id="caption"></div>
</div></div>
<div id="ui">
  <span id="status" style="font-weight:500;opacity:.85"></span>
  <label>Film <select id="filmSel" style="font:inherit;font-weight:500;padding:6px 8px;border-radius:6px;border:1px solid #6a4a1a;background:#1a1206;color:#fff"></select></label>
  <label>Hero <input id="name" type="text" maxlength="24" placeholder="the name to honour"></label>
  <button id="picBtn" title="The hero's picture for the end card: choose a file, or copy a picture and paste it on this page, or drop one here">Add picture</button>
  <button id="picOff" style="display:none">Remove picture</button><input id="picFile" type="file" accept="image/*" style="display:none">
  <button id="play" class="on" title="Play the film from the start (or press the space bar)">Play the film</button>
  <button id="stop">Stop</button>
  <button id="caps" title="Show the narrator's words on screen, for viewers with the sound off">Words on screen: off</button>
  <span style="font-weight:500;font-size:12px;opacity:.7">Press H to hide these controls.</span>

  <div id="obsRow" style="flex-basis:100%;display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;justify-content:center;border-top:1px solid rgba(233,194,117,.2);padding-top:8px">
    <span style="font-weight:500;opacity:.85">The film in OBS:</span>
    <button id="sendPlay" class="on" title="Play the film, with this name, in the OBS browser source. It does not play here.">Play in OBS</button>
    <button id="sendStop">Stop in OBS</button>
    <button id="copyLink" title="Copies the address of this film with this name, controls off, starting by itself. Paste it as the URL of a browser source in OBS (1920 by 1080).">Copy link for OBS</button>
    <label title="OBS: Tools, WebSocket Server Settings, Show Connect Info">OBS password <input id="obsPass" type="password" autocomplete="off" style="font:inherit;font-weight:500;padding:6px 8px;border-radius:6px;border:1px solid #6a4a1a;background:#1a1206;color:#fff;width:130px"></label>
    <button id="obsConnect" title="Connect this page to OBS on this computer">Connect to OBS</button>
    <span id="obsStatus" style="font-weight:500;opacity:.85">not connected</span>
  </div>
</div>
<script type="module" src="./hero.js"></script>
</body>
</html>
