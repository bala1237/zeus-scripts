<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Zeus Lasers</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; font-family: system-ui, sans-serif; }
  /* The picture is a 16:9 box in the middle of the space above the controls, with room round it (ZW-044, as on Andie's page). Its size is
     set by the Size slider or by dragging the corner grip. The grip and the thin outline lie just outside the box, so a capture cropped
     to the box is clean. With ?ui=0 (a browser source) there are no controls and the picture fills the window. */
  body { display: flex; flex-direction: column; }
  #area { position: relative; flex: 1; min-height: 0; background: #06070b; }
  #frame { position: absolute; overflow: hidden; background: #000; box-shadow: 0 0 0 1px rgba(120, 160, 220, .35), 0 12px 60px rgba(0, 0, 0, .8); }
  #grip { position: absolute; width: 20px; height: 20px; cursor: nwse-resize; z-index: 20; touch-action: none; border-right: 3px solid #7fb2ee; border-bottom: 3px solid #7fb2ee; border-radius: 0 0 5px 0; opacity: .75; }
  #grip:hover { opacity: 1; }
  body.plain #area { background: #000; } body.plain #frame { box-shadow: none; } body.plain #grip { display: none; }
  body.clear #frame { background: transparent; } body.clear.plain, body.clear.plain #area { background: transparent; }
  /* a stand-in for the camera picture, to judge the overlay against something */
  #mock { position: absolute; inset: 0; display: none; background: radial-gradient(ellipse 60% 55% at 50% 38%, #2b2f3d 0%, #14161d 55%, #07080b 100%); }
  #mock::before { content: ''; position: absolute; left: 50%; bottom: -6%; width: 19.1%; height: 62%; transform: translateX(-50%); border-radius: 46% 46% 12% 12% / 38% 38% 6% 6%; background: linear-gradient(#3a3440, #1c1a22); box-shadow: 0 0 60px rgba(0,0,0,.6); }
  #mock::after { content: ''; position: absolute; left: 50%; bottom: 52%; width: 9.6%; height: 21%; transform: translateX(-50%); border-radius: 50%; background: radial-gradient(circle at 45% 40%, #8a6f62, #4a3a36); }
  body.mock #mock { display: block; }
  /* cinema bars and a title for the largest gifts: the bars slide in from top and bottom, and the title sits in the lower one */
  .bar { position: absolute; left: 0; right: 0; height: 0; background: #000; z-index: 3; transition: height 1.1s cubic-bezier(.6, 0, .2, 1); pointer-events: none; }
  .bar.top { top: 0; } .bar.bot { bottom: 0; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  #frame.cine .bar { height: 10.5%; }
  #title { font: 600 1.9vh Georgia, 'Times New Roman', serif; letter-spacing: .42em; color: #f3d48a; white-space: nowrap; opacity: 0; transition: opacity 1.4s; text-shadow: 0 0 12px rgba(255, 190, 90, .5); }
  #frame.titled #title { opacity: 1; }
  /* the picture never takes clicks (the trap from ZW-040) */
  canvas { position: absolute; inset: 0; z-index: 1; pointer-events: none; }
  #ui { z-index: 10; flex: none; box-sizing: border-box; width: 100%; color: #fff; font: 600 13px system-ui; background: #0b0d16; border-top: 1px solid rgba(120, 160, 220, .4); padding: 8px 14px 10px; display: flex; flex-wrap: wrap; gap: 6px 18px; align-items: center; justify-content: center; }
  #ui.gone { display: none; }
  #ui .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  #ui button { background: #2f6fb0; color: #fff; padding: 7px 11px; border-radius: 8px; border: 0; font: inherit; cursor: pointer; }
  #ui button.on { background: #e2a92e; color: #1d1a2e; }
  #ui label { font-weight: 500; font-size: 12px; display: flex; align-items: center; gap: 6px; }
</style>
</head>
<body>
<div id="area"><div id="frame"><div id="mock"></div><div class="bar top"></div><div class="bar bot"><span id="title"></span></div></div><div id="grip" title="Drag to resize the picture. Double-click to fill the space."></div></div>
<div id="ui">
  <div style="display:flex;align-items:center;gap:9px"><span id="lamp" style="width:16px;height:16px;border-radius:50%;background:#2a3040;flex:none"></span><span>Zeus Lasers · <span id="status"></span></span></div>
  <div class="row">
    <button id="listen" title="Share the browser tab that is playing the music, with its audio ticked">Listen to the music</button>
    <button id="tap" title="Tap in time, three times or more (or press the space bar)">Tap the beat</button>
    <button id="demo" title="Run without music, at 124 beats a minute, to look at the light">Demo</button>
    <button id="stop">Stop</button>
  </div>
  <div class="row">
    <label>Theme <select id="theme" style="font:inherit;padding:5px;border-radius:6px"></select></label>
    <button id="look" title="What is shown: the lasers, the flow (ribbons of colour that never stop), or both (or press L)">Show: lasers</button>
    <button id="next" title="Move to another pattern now (or press N)">Next look</button>
    <button id="cam" class="on" title="Let the camera glide between angles">Camera: moving</button>
    <button id="set" title="The temple, the booth and the laser lattice behind the festival look. Turn off to have only the light, over your camera">Stage set: on</button>
    <button id="blackout" title="All light off, until pressed again (or press B)">Blackout</button>
  </div>
  <div class="row">
    <label title="How big the picture is in the window. You can also drag the blue corner. It is remembered.">Size <input id="size" type="range" min="25" max="100" step="1" value="60"> <span id="sizev"></span></label>
    <label>Brightness <input id="gain" type="range" min="0.2" max="2" step="0.05" value="1"></label>
    <label>Haze <input id="haze" type="range" min="0" max="1" step="0.05" value="1"></label>
    <label>Glow <input id="glow" type="range" min="0" max="1.5" step="0.05" value="0.45"></label>
  </div>
  <div class="row">
    <label title="If the lights hit before or after the beat you hear, slide this until they land together. It is remembered.">Beat timing <input id="sync" type="range" min="-250" max="250" step="5" value="0"> <span id="syncv" style="font-weight:500;font-size:12px"></span></label>
  </div>
  <div class="row" style="border:1px solid rgba(255,200,90,.45);border-radius:9px;padding:4px 8px">
    <label title="Try the gift moments without anyone sending a gift. Later these will be fired by real gifts.">Gift test <input id="gname" type="text" maxlength="18" value="Athena" style="font:inherit;padding:5px 7px;border-radius:6px;border:1px solid #445;background:#0e1220;color:#fff;width:120px"></label>
    <button id="g1" title="Lightning strikes one pillar and leaves a flame burning on it; the name on the booth (or press 1)">Small gift</button>
    <button id="g2" title="Lightning leaps from pillar to pillar along the whole row; three flames stay (or press 2)">Medium gift</button>
    <button id="g3" title="A storm gathers, a great bolt strikes the temple, the name is forged in gold and gold rains (or press 3)">Big gift</button>
    <button id="g5" title="A gift of 5,000 coins or more becomes a figure in the sky, as a short film. Here Wolf, 5,500 coins: the first size of show (about 12 seconds)">5,500</button>
    <button id="g6" title="Black Tiger, 22,000 coins: the second size (about 18 seconds). Adds an aurora, a shower of meteors and lightning walking in along six pillars">22,000</button>
    <button id="g7" title="Leon and Lion, 34,000 coins: the largest show (about 26 seconds). Adds two more rings, a web of lightning across the sky, and all twelve pillars struck">34,000</button>
    <button id="g8" class="on" title="TikTok's Zeus gift, 34,000 coins, with a staging of its own: eyes open in the dark above the temple, Zeus raises his thunderbolt and throws it, it lands on the temple and lights all twelve flames">Zeus</button>
    <button id="g4" title="Lights all twelve flames at once, to see what happens when the stream fills the temple: it answers by itself">Light all 12</button>
    <span id="flames" style="font-weight:500;font-size:12px;opacity:.85"></span>
  </div>
  <div class="row">
    <button id="bg" title="What is behind the light: black (for Add or Screen blending), clear (for a transparent source), or a stand-in for the camera">Background: black</button>
    <span id="stats" style="font-weight:500;font-size:12px;opacity:.8"></span>
  </div>
  <div style="font-weight:500;font-size:12px;opacity:.7">Drag the blue corner to resize the picture. Press H to hide these controls.</div>
</div>
<script type="module" src="./laser.js"></script>
</body>
</html>
