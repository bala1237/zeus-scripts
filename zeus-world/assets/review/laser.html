<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Zeus Lasers</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; font-family: system-ui, sans-serif; }
  body.clear { background: transparent; }
  /* a stand-in for the camera picture, to judge the overlay against something */
  #mock { position: fixed; inset: 0; display: none; background: radial-gradient(ellipse 60% 55% at 50% 38%, #2b2f3d 0%, #14161d 55%, #07080b 100%); }
  #mock::before { content: ''; position: absolute; left: 50%; bottom: -6%; width: 34vh; height: 62vh; transform: translateX(-50%); border-radius: 46% 46% 12% 12% / 38% 38% 6% 6%; background: linear-gradient(#3a3440, #1c1a22); box-shadow: 0 0 60px rgba(0,0,0,.6); }
  #mock::after { content: ''; position: absolute; left: 50%; bottom: 52vh; width: 17vh; height: 21vh; transform: translateX(-50%); border-radius: 50%; background: radial-gradient(circle at 45% 40%, #8a6f62, #4a3a36); }
  body.mock #mock { display: block; }
  canvas { position: fixed; inset: 0; }
  #ui { position: fixed; left: 16px; bottom: 14px; color: #fff; font: 600 13px system-ui; background: rgba(10,12,22,.8); padding: 10px 12px; border-radius: 12px; transition: opacity .5s; max-width: calc(100vw - 32px); }
  #ui.idle { opacity: 0; pointer-events: none; }
  #ui .row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 7px; align-items: center; }
  #ui button { background: #2f6fb0; color: #fff; padding: 7px 11px; border-radius: 8px; border: 0; font: inherit; cursor: pointer; }
  #ui button.on { background: #e2a92e; color: #1d1a2e; }
  #ui label { font-weight: 500; font-size: 12px; display: flex; align-items: center; gap: 6px; }
  body.idle { cursor: none; }
</style>
</head>
<body>
<div id="mock"></div>
<div id="ui">
  <div style="display:flex;align-items:center;gap:9px"><span id="lamp" style="width:16px;height:16px;border-radius:50%;background:#2a3040;flex:none"></span><span>Zeus Lasers · prototype · <span id="status"></span></span></div>
  <div class="row">
    <button id="listen" title="Share the browser tab that is playing the music, with its audio ticked">Listen to the music</button>
    <button id="tap" title="Tap in time, three times or more (or press the space bar)">Tap the beat</button>
    <button id="demo" title="Run without music, at 124 beats a minute, to look at the light">Demo</button>
    <button id="stop">Stop</button>
  </div>
  <div class="row">
    <label>Brightness <input id="gain" type="range" min="0.2" max="2" step="0.05" value="1"></label>
    <label>Haze <input id="haze" type="range" min="0" max="1" step="0.05" value="1"></label>
    <label>Glow <input id="glow" type="range" min="0" max="1.5" step="0.05" value="0.45"></label>
  </div>
  <div class="row">
    <button id="bg" title="What is behind the light: black (for Add or Screen blending), clear (for a transparent source), or a stand-in for the camera">Background: black</button>
    <span id="stats" style="font-weight:500;font-size:12px;opacity:.8"></span>
  </div>
  <div style="font-weight:500;font-size:12px;margin-top:7px;opacity:.7">This panel hides when the mouse is still. Press H to keep it hidden.</div>
</div>
<script type="module" src="./laser.js"></script>
</body>
</html>
